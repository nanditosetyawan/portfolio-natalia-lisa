name: Supabase Database Keep Alive

on:
  schedule:
    - cron: '0 0 * * 0' # Setiap hari Minggu jam 00:00 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Sending keep-alive request to Supabase..."
          curl -f -s -i -X GET "${SUPABASE_URL}/rest/v1/portfolios?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo "Keep-alive ping successful!"
